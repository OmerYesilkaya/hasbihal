name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Type-checking and tests don't need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @hasbihal/desktop build

  # The production image (infra/production) must keep building, and its native modules loading,
  # even while nothing is deployed.
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t hasbihal-server:ci .
      - name: Native modules load in the image
        run: >
          docker run --rm hasbihal-server:ci node --disable-warning=ExperimentalWarning -e
          "Promise.all([import('sharp'), import('argon2')]).then(() => console.log('ok'))"
