name: Release

# Builds the installers (DECISIONS A30: plain .dmg and .exe, no auto-update), updates the server,
# and puts the installers on a draft GitHub Release for the owner to check and publish; its notes
# are the version's section of CHANGELOG.md. Push a tag that matches the app's version
# (apps/desktop/package.json) and has a CHANGELOG.md section, e.g.
# `git tag v1.0.0 && git push origin v1.0.0`. Run by hand from the Actions tab, it only builds:
# the installers are kept as workflow artifacts, and the server is left alone.
#
# Needs, under the repository's Settings → Secrets and variables → Actions:
#   - variable HASBIHAL_SERVER_URL: the server the app talks to, e.g. https://hasbihal.duckdns.org
#     (it is built into the app, A30);
#   - secrets MAC_CERT_P12 (the "Hasbihal Self-Signed" certificate and key, .p12, base64) and
#     MAC_CERT_PASSWORD (A50);
#   - secret DEPLOY_SSH_KEY: the private half of a key that the server only lets run
#     infra/production/deploy.sh (infra/production/README.md, "Updating").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  MAIN_VITE_SERVER_URL: ${{ vars.HASBIHAL_SERVER_URL }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The server address is set
        run: |
          if [ -z "$MAIN_VITE_SERVER_URL" ]; then
            echo "::error::Set the HASBIHAL_SERVER_URL variable: the app has its server built in (A30)."
            exit 1
          fi
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the app's version ${version}."
            exit 1
          fi
      - name: The changelog says what's new
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! grep -qxF "## ${GITHUB_REF_NAME#v}" CHANGELOG.md; then
            echo "::error::Add a \"## ${GITHUB_REF_NAME#v}\" section to CHANGELOG.md: it becomes the release notes."
            exit 1
          fi

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A50: a stable self-signed identity, so macOS keeps everyone's permissions across updates.
      # An ad-hoc build would lose them, so there is no fallback: without the certificate, stop.
      - name: Install the signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::error::Add the MAC_CERT_P12 and MAC_CERT_PASSWORD secrets (DECISIONS A50)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          # A self-signed certificate is only usable for code signing once it is trusted.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MAC_CERT_PASSWORD -nokeys -legacy \
            -out "$RUNNER_TEMP/cert.pem" 2>/dev/null ||
            openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MAC_CERT_PASSWORD -nokeys \
              -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$keychain" | grep -q "Hasbihal Self-Signed"
          rm "$RUNNER_TEMP/cert.p12"
      - run: pnpm --filter @hasbihal/desktop package
      - uses: actions/upload-artifact@v4
        with:
          name: hasbihal-macos
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    env:
      # Unsigned (A30): don't look for a code-signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hasbihal/desktop package
      - uses: actions/upload-artifact@v4
        with:
          name: hasbihal-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # The version's changelog section, and where to find the install steps.
      - name: Write the release notes
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" \
            '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          printf '\n---\n\nKurulum: %s/%s/blob/main/docs/KURULUM.md\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md
      # A draft: the owner tests the installers, then publishes it and tells the family (A30).
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" installers/* --draft --title "Hasbihal
          ${GITHUB_REF_NAME#v}" --notes-file notes.md

  # The server goes out with the installers: only once both have built, so a release is all or
  # nothing. Current apps keep working with the new server, so updating it first is safe; the
  # owner publishes the draft afterwards.
  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    # Never two deploys at once; a newer tag waits for the one in progress.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # The server's SSH host key, pinned: the deploy key is only ever offered to the real server.
      # `ssh-keyscan -t ed25519 <host>` prints it; check the fingerprint on the server itself.
      SERVER_HOST_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGrVLRPP6nt7paQTUIgRWDH8BAZ8FOEQ4mrEcK9wqmkv'
    steps:
      - name: Update the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Add the DEPLOY_SSH_KEY secret (infra/production/README.md, \"Updating\")."
            exit 1
          fi
          host="${MAIN_VITE_SERVER_URL#https://}"
          host="${host%%/*}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "$host $SERVER_HOST_KEY" > ~/.ssh/known_hosts
          # The server's authorized_keys runs deploy.sh for this key, whatever is asked.
          ssh -T -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "root@$host"
          rm ~/.ssh/deploy
      - name: The server answers
        run: >
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors
          "$MAIN_VITE_SERVER_URL/health"
