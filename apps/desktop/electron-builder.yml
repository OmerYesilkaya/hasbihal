# Installers not signed by Apple or Microsoft, which update themselves from published GitHub
# Releases (DECISIONS A30, ARCHITECTURE §4.5). Minimum OS versions per A49.
appId: com.hasbihal.desktop
productName: Hasbihal
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# The tray icons are read with nativeImage.createFromPath, from a real file.
asarUnpack:
  - resources/**
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  target:
    - target: dmg
      arch: [universal]
    # What the app updates itself from (Squirrel.Mac); the dmg is only for the first install.
    - target: zip
      arch: [universal]
  category: public.app-category.social-networking
  minimumSystemVersion: '14.2'
  # Self-signed certificate from the build machine's Keychain (DECISIONS A50). It gives the
  # app a stable identity, so macOS keeps privacy permissions across updates. Not notarized.
  identity: Hasbihal Self-Signed
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Hasbihal uses the microphone so you can talk in rooms.
    NSCameraUsageDescription: Hasbihal uses the camera so others can see you in rooms.
    # Without this key, macOS 14.2+ silently delivers an empty system-audio track (ARCHITECTURE §6.2).
    NSAudioCaptureUsageDescription: Hasbihal captures your computer's audio when you share your screen with sound.
dmg:
  title: Hasbihal ${version}
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  # No spaces: GitHub turns them into dots, and latest.yml must name the file as uploaded.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# The update feed (latest-mac.yml, latest.yml) is read from the repository's published Releases:
# drafts and pre-releases never reach anyone. The workflow uploads the files; electron-builder
# never publishes (`--publish never`).
publish:
  provider: github
  owner: OmerYesilkaya
  repo: hasbihal
  releaseType: release
