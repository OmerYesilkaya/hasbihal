# Production on one VPS (ARCHITECTURE §10.1, ROADMAP M1 step 9). See README.md for the runbook.
# Everything is configured through .env next to this file (copy .env.example).
name: hasbihal

services:
  postgres:
    image: postgres:17.12
    restart: unless-stopped
    environment:
      POSTGRES_USER: hasbihal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hasbihal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hasbihal -d hasbihal']
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hasbihal:${POSTGRES_PASSWORD}@postgres:5432/hasbihal
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in .env}
      LIVEKIT_URL: wss://${HASBIHAL_HOST}/livekit
      LIVEKIT_API_URL: http://host.docker.internal:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      # The app's Google OAuth client (A25): only ID tokens issued to it are accepted.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      # Feedback becomes GitHub issues (A56). Optional: blank keeps it in the database only.
      FEEDBACK_GITHUB_REPO: ${FEEDBACK_GITHUB_REPO:-}
      FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
      # Behind Caddy: rate limits must see the client's address, not Caddy's.
      TRUST_PROXY: 'true'
      # The packaged desktop app's origin (A30: there is no web client).
      ALLOWED_ORIGINS: app://hasbihal
      LOG_LEVEL: info
    volumes:
      - files:/data/files
    # Loopback only: for LiveKit's webhooks (it uses host networking). The public way in is Caddy.
    ports:
      - '127.0.0.1:8080:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Media goes straight to LiveKit (UDP); only its signaling WebSocket goes through Caddy.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    depends_on: [server]
    ports:
      - '80:80'
      - '443:443'
    environment:
      HASBIHAL_HOST: ${HASBIHAL_HOST:?set HASBIHAL_HOST in .env}
    extra_hosts:
      # LiveKit uses host networking; this name reaches the host from Caddy's container.
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

  # Nightly encrypted backups of the database and the files, and a monthly restore drill
  # (A31; backup/). Logs: docker compose logs backup
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hasbihal:${POSTGRES_PASSWORD}@postgres:5432/hasbihal
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY in .env}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
      # Off-site storage through its S3-compatible API (Backblaze B2, …); unused for /backups.
      AWS_ACCESS_KEY_ID: ${BACKUP_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_KEY:-}
    volumes:
      - files:/data/files
      - backup-state:/state
      # A local repository (RESTIC_REPOSITORY=/backups) until off-site storage is set up.
      - ${BACKUP_LOCAL_DIR:-./backups}:/backups

volumes:
  postgres-data:
  files:
  backup-state:
  caddy-data:
  caddy-config:
